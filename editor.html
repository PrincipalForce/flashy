<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashy Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<!-- Loading card. Static markup rather than JS-built, so it paints on the very
     first frame instead of after editor-app.js parses. splash.js fills in the
     tip and fades it out. -->
<div id="splash">
  <div class="splash-frame">
    <div class="splash-mark">
      <div class="splash-mark-inner"><span class="fy-f">F</span><span class="fy-y">y</span></div>
    </div>
    <div class="splash-name">Flashy.</div>
    <div class="splash-sub">vector animation studio</div>
    <div class="splash-progress"><div class="splash-progress-bar"></div></div>
    <div class="splash-tip" id="splash-tip"></div>
    <div class="splash-credits">v0.7 · 2026 · Flash-inspired</div>
  </div>
</div>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="main">
    <div id="toolbox"></div>
    <div id="stage-wrap"><canvas id="stageCanvas"></canvas></div>
    <!-- Dock zones are filled by workspace.js from #panel-store below. The
         splitters are drag handles; see .dock-splitter in workspace.js. -->
    <div class="dock-splitter vertical" data-resize="right" title="Drag to resize"></div>
    <div class="dock-zone" id="dock-right" data-zone="right"></div>
  </div>
  <div class="dock-splitter horizontal" data-resize="timeline" title="Drag to resize the timeline"></div>
  <div id="tl-section">
    <div id="tl-head">
      <span class="title">Timeline</span>
      <span class="tl-spacer-flex"></span>
      <!-- Onion skin. Flash put these under the layer column; here they sit in
           the timeline header, which is the one strip that is always visible
           whatever the dock layout. The range inputs are frame COUNTS either
           side of the playhead, because that is what an animator thinks in. -->
      <span class="tl-onion">
        <button type="button" id="tlOnion" class="tl-zoom-btn wide" title="Onion skin — show the frames around this one (Alt+O)">Onion</button>
        <button type="button" id="tlOnionOutline" class="tl-zoom-btn wide" title="Onion skin as outlines only">Outlines</button>
        <input type="number" id="tlOnionBefore" class="tl-onion-num" min="0" max="12" title="Frames to show before this one">
        <input type="number" id="tlOnionAfter" class="tl-onion-num" min="0" max="12" title="Frames to show after this one">
      </span>
      <!-- Zooming the timeline is what makes a long soundtrack workable:
           out to see the whole track, in to find a syllable. -->
      <span class="tl-zoom">
        <button type="button" id="tlZoomOut" class="tl-zoom-btn" title="Zoom timeline out (Ctrl+wheel)">&#8722;</button>
        <span id="tlZoomLabel" class="tl-zoom-label">12px</span>
        <button type="button" id="tlZoomIn" class="tl-zoom-btn" title="Zoom timeline in (Ctrl+wheel)">+</button>
        <button type="button" id="tlZoomFit" class="tl-zoom-btn wide" title="Zoom out to show the whole movie">Fit</button>
      </span>
    </div>
    <div id="tl-body">
      <div id="tl-layers"><div id="tl-layers-inner"><div id="layerList"></div></div></div>
      <!-- The spacer carries the full timeline extent so native scrollbars
           work; the canvas stays viewport-sized and draws only what is in
           view (see renderTLFrames). -->
      <div id="tl-frames"><div id="tl-spacer"><canvas id="tlCanvas"></canvas></div></div>
    </div>
  </div>
  <div class="dock-splitter horizontal" data-resize="bottom" title="Drag to resize"></div>
  <div class="dock-zone" id="dock-bottom" data-zone="bottom"></div>
</div>

<!--
  Panel contents live here and are moved into whichever dock the user has
  arranged. The inner ids (propsPanel, colorPanel, libPanel, aiPanel,
  frame-script) are the ones editor-app.js looks up, so they must not change:
  docking relocates these nodes, it never rebuilds them. A panel that is not
  currently visible is parked back here with its DOM — and therefore its state
  (AI conversation, unsent frame script) — intact.
-->
<div id="panel-store" hidden>
  <div class="panel-content" data-panel="props"><div class="panel-body" id="propsPanel"></div></div>
  <div class="panel-content" data-panel="color"><div class="panel-body" id="colorPanel"></div></div>
  <div class="panel-content" data-panel="library"><div class="panel-body" id="libPanel"></div></div>
  <!-- Align, Info and Transform are built by editor-app.js into these bodies,
       the same contract the other panels use: the markup declares the mount
       point, the editor fills it, workspace.js only ever moves it. -->
  <div class="panel-content" data-panel="align"><div class="panel-body" id="alignPanel"></div></div>
  <div class="panel-content" data-panel="info"><div class="panel-body" id="infoPanel"></div></div>
  <div class="panel-content" data-panel="transform"><div class="panel-body" id="transformPanel"></div></div>
  <div class="panel-content" data-panel="scene"><div class="panel-body" id="scenePanel"></div></div>
  <div class="panel-content" data-panel="history"><div class="panel-body" id="historyPanel"></div></div>
  <div class="panel-content" data-panel="debugger"><div class="panel-body" id="debuggerPanel"></div></div>
  <div class="panel-content" data-panel="explorer"><div class="panel-body" id="explorerPanel"></div></div>
  <div class="panel-content" data-panel="behaviors"><div class="panel-body" id="behaviorsPanel"></div></div>
  <div class="panel-content" data-panel="swatches"><div class="panel-body" id="swatchesPanel"></div></div>
  <!-- Where trace() goes. A log, so it is built once and appended to rather
       than rebuilt on every refresh like the inspector panels. -->
  <div class="panel-content" data-panel="output">
    <div class="panel-body output-body">
      <div class="output-bar">
        <button type="button" id="outputClear" class="props-btn-action">Clear</button>
        <button type="button" id="outputCopy" class="props-btn-action">Copy</button>
        <span id="outputCount" class="output-count"></span>
      </div>
      <div id="outputLog" class="output-log"></div>
    </div>
  </div>
  <div class="panel-content" data-panel="character"><div class="panel-body" id="charPanel"></div></div>
  <div class="panel-content" data-panel="actions">
    <div class="panel-body actions-body">
      <!-- Which script is being edited: the keyframe's, or the selected
           object's handlers. Flash showed one Actions panel for both, and
           which one you were looking at was never obvious — so it says. -->
      <div id="actions-target" class="actions-target">Frame script</div>
      <!-- A code editor, not a bare textarea: line numbers, highlighting and
           an error line. The textarea keeps its id and stays the thing that
           holds the text — editor-app.js reads it and workspace.js moves this
           whole node between docks, so neither may be rebuilt. The highlight
           layer sits UNDER a transparent-text textarea, which is what keeps
           the caret, selection, undo and IME behaviour native. -->
      <div class="code-hints" id="code-hints"></div>
      <div class="code-wrap" id="code-wrap">
        <div class="code-gutter" id="code-gutter"></div>
        <div class="code-scroll">
          <pre class="code-highlight" id="code-highlight" aria-hidden="true"></pre>
          <textarea id="frame-script" class="code-input" spellcheck="false"
                    placeholder="// Frame script (JavaScript)"></textarea>
        </div>
      </div>
      <div class="code-status" id="code-status"></div>
    </div>
  </div>
  <div class="panel-content" data-panel="ai">
    <div class="panel-body ai-body"><div id="aiPanel"></div></div>
  </div>
</div>

<script src="splash.js"></script>
<script src="flashy.js"></script>
<!-- Raster → vector tracing. Pure, no DOM: it takes an ImageData and returns
     path command streams, which is what makes it testable on its own. -->
<script src="flashy-trace.js"></script>
<!-- Flash import. The readers (.swf, .fla/XFL) produce a plain document model;
     flashy-import.js turns that model into an editable Flashy document, and
     flashy-avm1.js decompiles the ActionScript the movie carries. Order
     matters: flashy-fla.js shares the SWF reader's shape stitching. -->
<script src="flashy-avm1.js"></script>
<script src="flashy-abc.js"></script>
<!-- Object handlers: onClipEvent/on blocks, run with an AS2-shaped scope.
     Loaded here so the editor can parse and validate them; exports embed a
     copy only when the document actually carries handlers. -->
<script src="flashy-as2.js"></script>
<script src="flashy-swf.js"></script>
<!-- Writing a .swf. Separate from the reader because it is only needed on an
     export, and because the reader is this writer's test oracle: write a
     movie, read it back with flashy-swf.js, compare. -->
<script src="flashy-swf-write.js"></script>
<script src="flashy-fla.js"></script>
<script src="flashy-import.js"></script>
<!-- Polygon geometry for the eraser: outlines, boolean subtraction, polyline
     cutting. Pure, like the tracer. -->
<script src="flashy-geom.js"></script>
<script src="feedback.js"></script>
<!-- Dockable panel layout. Loaded before editor-app.js so its DOMContentLoaded
     handler runs first and the docks exist before the editor fills them. -->
<script src="workspace.js"></script>
<script src="character.js"></script>
<script src="editor-app.js"></script>
<!-- Electron desktop integration. A no-op in a browser: it does nothing unless
     window.flashyDesktop exists, which only the Electron preload creates. -->
<script src="desktop.js"></script>
</body>
</html>
