<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Flashy">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1b30"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffdd44" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffdd44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe77a"/>
      <stop offset="100%" stop-color="#e5a800"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- "Fy" wordmark. The letterforms are stroked geometric paths rather than
       <text>, so the icon rasterizes identically on every machine with no font
       dependency — important, since the build host rasterizes this to PNG.
       All ink sits well inside the 410px maskable safe-zone circle. -->
  <g transform="translate(-27,-44)" fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <!-- F — stem plus two arms, flush at the cap height -->
    <g stroke="#f8fafc" stroke-width="46">
      <path d="M168 179 H258"/>
      <path d="M168 156 V356"/>
      <path d="M168 256 H238"/>
    </g>
    <!-- y — two diagonals meeting at the baseline, the right one carrying on
         into the descender. Carries the timeline-accent gradient. -->
    <g stroke="url(#yg)" stroke-width="42" stroke-linecap="round">
      <path d="M306 246 L351 356"/>
      <path d="M400 246 L318 430"/>
    </g>
  </g>
</svg>
