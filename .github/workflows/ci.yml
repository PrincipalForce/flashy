name: CI

on:
  push:
    branches: [main]
  pull_request:

# A static app with no build step still needs a guard: every bug the first
# round of these tests was written for was a silent one — symbols vanishing
# from exports, frame scripts doing nothing, a document that could not be
# reopened. None of them would surface in review.
jobs:
  test:
    name: Editor tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Editor tests
        run: npm run test:web

      # The Electron specs drive the real desktop shell, which needs a display.
      - name: Desktop shell tests
        run: xvfb-run -a npm run test:desktop

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  syntax:
    name: Parse check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # There is no bundler, so nothing else would ever catch a syntax error in
      # a file the editor only loads at runtime.
      - name: node --check every source file
        run: |
          set -e
          for f in flashy.js flashy-swf.js flashy-fla.js flashy-trace.js \
                   editor-app.js desktop.js workspace.js character.js \
                   splash.js feedback.js electron/*.cjs scripts/*.cjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Packaged file list covers every script the editor loads
        run: node scripts/check-packaged-files.cjs

      - name: Version strings agree
        run: node scripts/check-version.cjs
